[package]
name = "at-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "at_core"

[dependencies]
serde.workspace = true
# GraphQL bodies are built as JSON (and their variables validated).
serde_json.workspace = true
thiserror.workspace = true
# Dynamic `{{$guid}}`-style variables: v4 UUIDs, and the OS random source for the others.
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
regex = "1"
