[package]
name = "at-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "api-tester"
path = "src/main.rs"

[dependencies]
at-core = { path = "../core" }
at-http = { path = "../http" }
at-store = { path = "../store" }
at-history = { path = "../history" }
at-interop = { path = "../interop" }
at-codegen = { path = "../codegen" }
at-script = { path = "../script" }
gpui = { version = "0.2", features = ["runtime_shaders"] }
gpui-component = "0.5"
tokio.workspace = true
tokio-util.workspace = true
async-channel = "2"
