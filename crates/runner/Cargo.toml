[package]
name = "at-runner"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "at_runner"

# The send pipeline without a UI (pre-request script -> build -> send -> tests -> history)
# and the collection run loop. The GUI, the CLI and later the mock/MCP servers share it.
[dependencies]
at-core = { path = "../core" }
at-http = { path = "../http" }
at-store = { path = "../store" }
at-history = { path = "../history" }
at-script = { path = "../script" }
tokio.workspace = true
tokio-util.workspace = true
async-channel = "2"
# data files (JSON) and the JSON report
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# checks the JUnit report is well-formed XML (already in the lock via the GUI crate)
roxmltree = "0.20"
